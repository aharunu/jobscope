services:
  postgres:
    image: postgres:16-alpine
    container_name: jobscope_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jobscope
      POSTGRES_USER: jobscope
      POSTGRES_PASSWORD: jobscope
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobscope -d jobscope"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
