name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend CI (Python / Ruff / Pytest)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://jobscope:jobscope_ci_password@localhost:5432/jobscope
      JOBSCOPE_REQUIRE_DATABASE: "1"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jobscope
          POSTGRES_USER: jobscope
          POSTGRES_PASSWORD: jobscope_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Check formatting with Ruff
        run: |
          ruff format --check .

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Run backend tests
        run: |
          pytest -v

  frontend:
    name: Frontend CI (Node.js / TypeScript / Vitest / Next.js)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci

      - name: Type check (TypeScript)
        run: |
          npx tsc --noEmit

      - name: Run Vitest tests
        run: |
          npm test

      - name: Verify production build
        run: |
          npm run build
